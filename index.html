<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Razas de Perros 🐶</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
</head>
<body>
    <div class="container">
        <h1>Galería de Razas de Perros</h1>
        
        <div class="filter-section">
            <h3>Filtrar por tamaño:</h3>
            <div class="filter-buttons">
                <button class="filter-btn active" data-size="all">
                    🐕 Todas
                </button>
                <button class="filter-btn" data-size="small">
                    🐩 Pequeño
                </button>
                <button class="filter-btn" data-size="medium">
                    🦮 Mediano
                </button>
                <button class="filter-btn" data-size="large">
                    🐕‍🦺 Grande
                </button>
            </div>
        </div>

        <div id="gallery" class="gallery"></div>

        <footer class="footer">
            <p>Desarrollado por <strong>Fer Sanz Development</strong></p>
        </footer>
    </div>

    <!-- Modal de información de raza -->
    <div id="breedModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <img id="modalImage" src="" alt="">
                <h2 id="modalTitle"></h2>
            </div>
            <div class="modal-body">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-icon">📏</span>
                        <div class="info-details">
                            <strong>Tamaño</strong>
                            <p id="modalSize"></p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">🌍</span>
                        <div class="info-details">
                            <strong>Origen</strong>
                            <p id="modalOrigin"></p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">⏳</span>
                        <div class="info-details">
                            <strong>Esperanza de Vida</strong>
                            <p id="modalLifespan"></p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">💝</span>
                        <div class="info-details">
                            <strong>Temperamento</strong>
                            <p id="modalTemperament"></p>
                        </div>
                    </div>
                </div>
                <div class="description-section">
                    <h3>Descripción</h3>
                    <p id="modalDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
